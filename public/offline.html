<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b100b">
  <title>Offline · Schulplaner</title>
  <style>
    @font-face { font-family: 'Inter'; src: url('/fonts/inter-latin.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      font-family: 'Inter', system-ui, sans-serif; background: #0b100b; color: #edf0e5; }
    h1 { font-size: 1.45rem; margin: 22px 0 8px; letter-spacing: -.03em; font-weight: 600; }
    p { color: #98a18f; max-width: 34ch; margin: 0 auto 26px; font-size: .94rem; line-height: 1.55; }
    .art { width: 88px; height: 88px; border-radius: 24px; background: #20301a; border: 1px solid rgba(201,243,158,.22); color: #c9f39e; display: grid; place-items: center; margin: 0 auto; }
    button { min-height: 48px; padding: 0 26px; border: 0; border-radius: 14px; background: #c9f39e; color: #15230c; font-size: .95rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: transform .16s ease, background-color .2s ease; }
    button:hover { background: #d8f8b6; transform: translateY(-1px); }
    button:active { transform: translateY(0) scale(.97); }
    @media (prefers-color-scheme: light) {
      body { background: #efeee8; color: #1b1d17; }
      p { color: #61645a; }
      .art { background: #e3ecd6; border-color: rgba(60,90,50,.2); color: #3c5a32; }
      button { background: #3c5a32; color: #fff; }
      button:hover { background: #4a6d3d; }
    }
  </style>
</head>
<body>
  <main>
    <div class="art" aria-hidden="true"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/></svg></div>
    <h1>Du bist offline</h1>
    <p>Diese Seite wurde noch nicht zwischengespeichert. Sobald du wieder online bist, geht es weiter.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
